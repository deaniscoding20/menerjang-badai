name: Release eligibility (no deployment)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Informational attestation only. VPS independently refetches all metadata.
permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-eligibility-menerjangbadai
  cancel-in-progress: false

jobs:
  attest:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Attest owner merge and successful CI at current main SHA
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release_policy.py
          --event-file "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --owner deaniscoding20
      # No production access, artifact transfer or remote command is available.
      # This result is NOT a readiness grant and is never trusted by the VPS.
